<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title description">
<title id="title">Price Tracker MongoDB ER diagram</title>
<desc id="description">Users own sessions, tokens and private trackers; Products and observed history are shared. Trackers queue independent channel deliveries. Device tokens bind to a current session. All foreign keys are listed on cards; principal relationships are connected.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52647a"/></marker></defs>
<rect width="1280" height="920" fill="#f5f7fb"/>
<g font-family="Arial, sans-serif" fill="#182838">
<text x="40" y="45" font-size="26" font-weight="700">Price Tracker · MongoDB schema</text>
<text x="40" y="72" font-size="16">Steam / US / USD · shared offers and history · private accounts, trackers and deliveries</text>
<path d="M 390 175 H 460" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="158" font-size="12">1 : many</text>
<path d="M 810 175 H 880" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="825" y="158" font-size="12">1 : many</text>
<path d="M 215 270 V 350" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="227" y="315" font-size="12">1 : many</text>
<path d="M 390 230 H 425 V 425 H 460" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="320" font-size="12">owns</text>
<path d="M 880 425 H 810" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="825" y="408" font-size="12">1 : many</text>
<path d="M 1055 520 V 560 H 635 V 600" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="825" y="550" font-size="12">1 : many</text>
<path d="M 635 520 V 550 H 215 V 600" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="540" font-size="12">1 : many</text>
<path d="M 460 675 H 390" fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)"/><text x="394" y="658" font-size="12">reference</text>
<g transform="translate(40 100)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">User</text><text x="16" y="76" font-size="14">email UNIQUE</text><text x="16" y="104" font-size="14">passwordHash (private)</text><text x="16" y="132" font-size="14">emailVerifiedAt, role</text></g>
<g transform="translate(460 100)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">Session</text><text x="16" y="76" font-size="14">userId -&gt; User</text><text x="16" y="104" font-size="14">transport, secretHash (private)</text><text x="16" y="132" font-size="14">expiresAt, revokedAt</text></g>
<g transform="translate(880 100)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">Device</text><text x="16" y="76" font-size="14">userId -&gt; User; sessionId -&gt; Session</text><text x="16" y="104" font-size="14">installationId UNIQUE</text><text x="16" y="132" font-size="14">pushToken UNIQUE (private)</text></g>
<g transform="translate(40 350)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">AuthToken</text><text x="16" y="76" font-size="14">userId -&gt; User; purpose</text><text x="16" y="104" font-size="14">tokenHash UNIQUE (private)</text><text x="16" y="132" font-size="14">expiresAt, consumedAt</text></g>
<g transform="translate(460 350)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">TrackedItem</text><text x="16" y="76" font-size="14">userId -&gt; User; productId -&gt; Product</text><text x="16" y="104" font-size="14">targetPriceMinor, alerts, enabled</text><text x="16" y="132" font-size="14">targetRevision, episodeId, state</text></g>
<g transform="translate(880 350)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">Product</text><text x="16" y="76" font-size="14">provider + game/store/US/USD UNIQUE</text><text x="16" y="104" font-size="14">steamAppId, dealId (distinct IDs)</text><text x="16" y="132" font-size="14">price, success/attempt time, lease</text></g>
<g transform="translate(40 600)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">NotificationDelivery</text><text x="16" y="76" font-size="14">trackedItemId -&gt; TrackedItem</text><text x="16" y="104" font-size="14">episodeId + channel UNIQUE per tracker</text><text x="16" y="132" font-size="14">status, attempts, fenced lease</text></g>
<g transform="translate(460 600)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">PriceHistory</text><text x="16" y="76" font-size="14">productId -&gt; Product; checkId</text><text x="16" y="104" font-size="14">priceMinor, observedAt, source</text><text x="16" y="132" font-size="14">immutable; rolling 90-day cap</text></g>
<g transform="translate(880 600)"><rect width="350" height="170" rx="10" fill="white" stroke="#9eafc0"/><path d="M 10 0 H 340 Q 350 0 350 10 V 44 H 0 V 10 Q 0 0 10 0" fill="#183e67"/><text x="16" y="29" font-size="18" font-weight="700" fill="white">ProviderBudget</text><text x="16" y="76" font-size="14">_id = cheapshark (singleton)</text><text x="16" y="104" font-size="14">shared pacing/cooldown</text><text x="16" y="132" font-size="14">leaseToken, leaseUntil</text></g>
<text x="40" y="820" font-size="15">Every collection has a primary key. Arrow direction: one → many. User/Session ownership is enforced by services.</text>
<text x="40" y="848" font-size="15">Delivery also references User, Product and PriceHistory. Device also references User. References are logical, not MongoDB foreign keys.</text>
<text x="40" y="876" font-size="15">ProviderBudget is an independent singleton. See docs/database.md for all unique indexes, TTLs and transaction requirements.</text>
</g></svg>