<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title description">
<title id="title">Loading, empty &amp; error states — Price Tracker web wireframe</title>
<desc id="description">State wireframes for issue #5. Unsupported item types require backend validation; these are examples of messages, not live detection.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="998" height="998" rx="6" fill="#f5f7f9" stroke="#a5adb6"/>
<text x="28" y="34" font-size="13" fill="#667380">PRICE TRACKER / WEB WIREFRAME</text>
<text x="28" y="69" font-size="26" fill="#253342">Loading, empty &amp; error states</text>
<rect x="24" y="90" width="952" height="54" rx="6" fill="#fff" stroke="#a5adb6"/>
<text x="42" y="123" font-size="18" fill="#253342">Price Tracker</text>
<text x="240" y="123" font-size="14" fill="#253342">Home   |   Watchlist   |   Add tracker   |   Notifications   |   Sign in</text>
<text x="28" y="171" font-size="14" fill="#667380">Frontend preview • example prices • changes reset on refresh</text>
<text x="28" y="209" font-size="17" fill="#253342">Required state sketches — not live provider results</text><rect x="28" y="232" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="45" y="263" font-size="20" fill="#253342">Loading</text><text x="45" y="295" font-size="14" fill="#253342">Watchlist rows become placeholders.</text><text x="45" y="320" font-size="14" fill="#253342">Loading games…</text><text x="45" y="345" font-size="14" fill="#253342">No price check is triggered.</text><rect x="508" y="232" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="525" y="263" font-size="20" fill="#253342">Empty</text><text x="525" y="295" font-size="14" fill="#253342">No tracked games to show.</text><text x="525" y="320" font-size="14" fill="#253342">[ Add your first tracker ]</text><text x="525" y="345" font-size="14" fill="#253342">Search with no matches: explain no results.</text><rect x="28" y="401" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="45" y="432" font-size="20" fill="#253342">Validation</text><text x="45" y="464" font-size="14" fill="#253342">Target must be non-negative USD.</text><text x="45" y="489" font-size="14" fill="#253342">Use at most two decimal places.</text><text x="45" y="514" font-size="14" fill="#253342">Account form: passwords must match.</text><rect x="508" y="401" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="525" y="432" font-size="20" fill="#253342">Expired session</text><text x="525" y="464" font-size="14" fill="#253342">Session-expired preview.</text><text x="525" y="489" font-size="14" fill="#253342">[ Sign in again ]</text><text x="525" y="514" font-size="14" fill="#253342">Real session enforcement belongs to the API.</text><rect x="28" y="570" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="45" y="601" font-size="20" fill="#253342">Unavailable price</text><text x="45" y="633" font-size="14" fill="#253342">No matching Steam offer.</text><text x="45" y="658" font-size="14" fill="#253342">Show “Price unavailable”, never $0.</text><text x="45" y="683" font-size="14" fill="#253342">Purchase unavailable; preserve known data.</text><rect x="508" y="570" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="525" y="601" font-size="20" fill="#253342">Unsupported bundle</text><text x="525" y="633" font-size="14" fill="#253342">Input: store.steampowered.com/bundle/…</text><text x="525" y="658" font-size="14" fill="#253342">Bundles are outside MVP scope.</text><text x="525" y="683" font-size="14" fill="#253342">Ask for an individual base-game link.</text><rect x="28" y="739" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="45" y="770" font-size="20" fill="#253342">Unsupported DLC</text><text x="45" y="802" font-size="14" fill="#253342">Input represents DLC rather than a base game.</text><text x="45" y="827" font-size="14" fill="#253342">Unknown app IDs require backend validation.</text><text x="45" y="852" font-size="14" fill="#253342">Do not guess that every /app/ URL is supported.</text><rect x="508" y="739" width="460" height="150" rx="6" fill="#fff" stroke="#a5adb6"/><text x="525" y="770" font-size="20" fill="#253342">Unsupported edition</text><text x="525" y="802" font-size="14" fill="#253342">Edition match cannot be verified.</text><text x="525" y="827" font-size="14" fill="#253342">Reject unknown or ambiguous editions.</text><text x="525" y="852" font-size="14" fill="#253342">Do not replace with a different edition.</text>
<text x="28" y="951" font-size="13" fill="#667380">Development tools: API connection (health only)</text>
<text x="28" y="976" font-size="13" fill="#667380">PC base games • Steam offers • US / USD • Planned price source: CheapShark</text>
</g>
</svg>
