<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
<title id="title">Home — Price Tracker web wireframe</title>
<desc id="description">Layout sketch of the frontend preview. Sample prices; no live accounts or alerts.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="1" y="1" width="998" height="758" rx="6" fill="#f5f7f9" stroke="#a5adb6"/>
<text x="28" y="34" font-size="13" fill="#667380">PRICE TRACKER / WEB WIREFRAME</text>
<text x="28" y="69" font-size="26" fill="#253342">Home</text>
<rect x="24" y="90" width="952" height="54" rx="6" fill="#fff" stroke="#a5adb6"/>
<text x="42" y="123" font-size="18" fill="#253342">Price Tracker</text>
<text x="240" y="123" font-size="14" fill="#253342">Home   |   Watchlist   |   Add tracker   |   Notifications   |   Sign in</text>
<text x="28" y="171" font-size="14" fill="#667380">Frontend preview • example prices • changes reset on refresh</text>
<text x="48" y="245" font-size="16" fill="#253342">For your next great game</text><text x="48" y="310" font-size="48" fill="#253342">Price Tracker</text><text x="48" y="355" font-size="18" fill="#253342">Your wishlist. Your price.</text><text x="48" y="380" font-size="18" fill="#253342">Keep an eye on the Steam games you want to play next.</text><rect x="48" y="411" width="210" height="40" rx="6" fill="#e5ecee" stroke="#a5adb6"/><text x="62" y="437" font-size="14" fill="#253342">Try a tracker</text><rect x="276" y="411" width="210" height="40" rx="6" fill="#e5ecee" stroke="#a5adb6"/><text x="290" y="437" font-size="14" fill="#253342">Explore the watchlist</text><text x="48" y="490" font-size="22" fill="#253342">How it works</text><text x="48" y="533" font-size="15" fill="#253342">01  Add a game</text><text x="48" y="558" font-size="15" fill="#253342">Paste a supported Steam link.</text><text x="360" y="533" font-size="15" fill="#253342">02  Set your price</text><text x="360" y="558" font-size="15" fill="#253342">Choose a target in USD.</text><text x="675" y="533" font-size="15" fill="#253342">03  Get notified</text><text x="675" y="558" font-size="15" fill="#253342">Checks and alerts are planned.</text>
<text x="28" y="711" font-size="13" fill="#667380">Development tools: API connection (health only)</text>
<text x="28" y="736" font-size="13" fill="#667380">PC base games • Steam offers • US / USD • Planned price source: CheapShark</text>
</g>
</svg>
