# HTTP bootstrap vhost. Certbot creates a separate TLS vhost and HTTPS redirect.
<VirtualHost *:80>
  ServerName largeproject.cop4331cfall26jo.com
  ServerAlias price-tracker-ibrahim.northcentralus.cloudapp.azure.com
  DocumentRoot /srv/price-tracker/current/apps/web/dist
  # Strip untrusted forwarding identity before the loopback proxy supplies it.
  RequestHeader unset X-Forwarded-For early
  RequestHeader unset X-Forwarded-Host early
  RequestHeader unset X-Forwarded-Proto early
  ProxyAddHeaders On
  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:4000/api/ connectiontimeout=5 timeout=30
  ProxyPassReverse /api/ http://127.0.0.1:4000/api/
  <Directory /srv/price-tracker/current/apps/web/dist>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^ /index.html [L]
  </Directory>
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "no-referrer"
  Header always set X-Frame-Options "DENY"
  ErrorLog ${APACHE_LOG_DIR}/price-tracker-error.log
  CustomLog ${APACHE_LOG_DIR}/price-tracker-access.log combined
</VirtualHost>
