name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name price-tracker-test-db \
            --publish 127.0.0.1:27028:27017 mongo:8.0 \
            --replSet rs0 --bind_ip_all
          for db_attempt in $(seq 1 30); do
            if docker exec price-tracker-test-db mongosh --quiet \
              --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec price-tracker-test-db mongosh --quiet \
            --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for db_attempt in $(seq 1 30); do
            if docker exec price-tracker-test-db mongosh --quiet \
              --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm run check
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27028/?directConnection=true
      - name: Remove disposable MongoDB
        if: always()
        run: docker rm --force price-tracker-test-db || true

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      # Bootstrap from the same official SDK tag used to generate the app.
      - name: Install Flutter 3.47.7
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
